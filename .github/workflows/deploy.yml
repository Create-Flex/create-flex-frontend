name: Deploy to S3 and Invalidate CloudFront
on:
  push:
    branches:
      - AWS # AWS 브랜치에 코드가 푸시(합병)될 때만 이 스크립트가 실행됩니다.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Node.js 18 버전 사용

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2 # 서울 리전 고정

      - name: Deploy to S3 bucket
        run: aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} --delete
        # dist 폴더 안의 빌드 결과물들을 S3 버킷으로 통째로 올려줍니다. 
        # --delete를 넣어 기존 파일과 비교하여 삭제된 파일은 지워 용량을 아낍니다.

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"
        # CloudFront 캐시를 무효화(삭제)해서 새로 고침 시 즉각 반영되게 만듭니다.
